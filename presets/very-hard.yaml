# ECMAScriptLens preset: VERY HARD — verdicts plus evidence.
name: very-hard
description: >
  Verdict plus the supporting construct named (function names, rule codes,
  orders, measure names). A verdict that names nothing is not a verdict.
tier: 2
epochs: 6
edit_budget: 6
batch_size: 25
gate: hard
suites:
  - purefn
  - checklines
  - forgeshape
  - resolvetrace
  - libgates
  - real-v1
  - real-v3
